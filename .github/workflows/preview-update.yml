name: Preview Update

on:
  push:
    branches: [develop, 'feature/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      message:
        description: 'Preview update message'
        required: false
        default: 'Preview update from GitHub Actions'

jobs:
  preview-update:
    name: Publish Preview Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Get branch name
        id: branch
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Publish preview update
        run: |
          BRANCH_NAME="${{ steps.branch.outputs.branch }}"
          # Replace special characters for branch name
          CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g')
          MESSAGE="${{ github.event.inputs.message || 'Preview update from GitHub Actions' }}"

          eas update --branch="preview-$CLEAN_BRANCH" --message="$MESSAGE - ${{ github.sha }}" --non-interactive

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref.replace(/[^a-zA-Z0-9]/g, '-');
            const message = `🚀 **Preview Update Published!**

            Branch: \`preview-${branch}\`

            You can test this update by:
            1. Opening your development build
            2. Navigating to the branch: \`preview-${branch}\`

            Or scan the QR code on the [Expo dashboard](https://expo.dev/accounts/[username]/projects/ci-cd/updates).`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
