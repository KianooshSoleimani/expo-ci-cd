name: EAS Update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Update branch'
        required: true
        default: 'main'
      message:
        description: 'Update message'
        required: false
        default: 'Update from GitHub Actions'

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        run: eas update --branch=${{ github.event.inputs.branch || 'main' }} --message="${{ github.event.inputs.message || 'Update from GitHub Actions' }}" --non-interactive
